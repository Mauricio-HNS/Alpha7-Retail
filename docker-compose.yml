services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alpha7_retail
      POSTGRES_USER: alpha7
      POSTGRES_PASSWORD: alpha7
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha7 -d alpha7_retail"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://alpha7:alpha7@postgres:5432/alpha7_retail
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
